services:
  - type: web
    name: youth-connect
    runtime: python
    plan: free
    buildCommand: pip install -r artifacts/api-server/requirements.txt
    startCommand: uvicorn server.main:app --app-dir artifacts/api-server --host 0.0.0.0 --port $PORT
    preDeployCommand: python artifacts/api-server/predeploy.py
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
